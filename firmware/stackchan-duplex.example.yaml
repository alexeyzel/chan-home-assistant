# Experimental: physical validation required. No AEC in this first-stage build.
substitutions:
  name: stackchan-test
  friendly_name: StackChan Test

packages:
  stackchan:
    url: https://github.com/m5stack/esphome-yaml
    files: [examples/kit/stackchan-bsp.factory.yaml]
    ref: cc708ddcc9dea7cfc746b408d2495ce281bbf2d2

external_components:
  - source:
      type: git
      url: https://github.com/m5stack/esphome-yaml
      ref: cc708ddcc9dea7cfc746b408d2495ce281bbf2d2
      path: components
    components: [axp2101, aw88298, aw9523b, si12t, m5ioe1, ftservo, scs9009]
  - source:
      type: git
      url: https://github.com/n-IA-hane/esphome-audio-stack
      ref: 0482d741a938378ef948e3b8f3dd31536f9f2cc9
      path: esphome/components
    components: [esp_audio_stack]
  - source:
      type: git
      url: https://github.com/kyvaith/pipecat-homeassistant
      ref: a538d1d1bacc8609061719f0b05c1622147ccb4b
      path: components
    components: [va_pipecat]

esphome:
  min_version: 2026.9.1
  on_boot:
    - priority: -100
      then:
        - lambda: id(duplex_speaker).set_volume(0.8f);

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  on_connect: !remove
  on_disconnect: !remove

api:
  custom_services: true

logger:
  level: DEBUG

# Audio Stack is the sole I2S owner. No legacy speaker/media player may claim it.
i2s_audio: !remove
media_player: !remove
esp32_camera: !remove
esp32_improv: !remove

# Retain official I2C codec drivers, power rails and reset handling.
# Both converters now use the same physical 48 kHz clock. The stack converts
# captured PCM to 16 kHz; the resampler converts Pipecat's 24 kHz playback.
audio_adc:
  - id: !extend es7210_adc
    sample_rate: 48000

esp_audio_stack:
  id: duplex_audio
  sample_rate: 48000
  output_sample_rate: 16000
  bits_per_sample: 16
  slot_bit_width: 16
  mic_channel: left
  rx_slot_mode: mono
  tx_channel: left
  i2s_mclk_pin:
    number: GPIO0
    ignore_strapping_warning: true
  i2s_bclk_pin: GPIO34
  i2s_lrclk_pin: GPIO33
  i2s_din_pin: GPIO14
  i2s_dout_pin: GPIO13
  buffers_in_psram: true
  on_state:
    - logger.log:
        format: "Audio Stack state: %s"
        args: [state.c_str()]

microphone:
  - id: !remove i2s_mic
  - platform: esp_audio_stack
    id: duplex_mic

speaker:
  - id: !remove i2s_speaker
  - platform: esp_audio_stack
    id: duplex_speaker
    buffer_duration: 100ms
  - platform: resampler
    id: pipecat_speaker
    output_speaker: duplex_speaker
    sample_rate: 48000
    bits_per_sample: 16

va_pipecat:
  id: pipecat_va
  auto_provision: true
  microphone:
    microphone: duplex_mic
    channels: 0
  speaker: pipecat_speaker
  barge_in: true
  playback_buffer_size: 2MB
  on_phase:
    - logger.log:
        format: "Pipecat phase: %s"
        args: [phase.c_str()]
  on_transcript:
    - logger.log:
        format: "Pipecat %s: %s"
        args: [role.c_str(), text.c_str()]
  on_error:
    - logger.log:
        level: ERROR
        format: "Pipecat error %s: %s"
        args: [code.c_str(), message.c_str()]

button:
  - platform: template
    name: Audio Diagnostics
    on_press:
      - esp_audio_stack.dump_diagnostics: duplex_audio
  - platform: template
    name: Pipecat Start
    on_press:
      - va_pipecat.start: pipecat_va
  - platform: template
    name: Pipecat Stop
    on_press:
      - va_pipecat.stop: pipecat_va

number:
  - platform: esp_audio_stack
    master_volume:
      name: Duplex Volume
      speaker_id: duplex_speaker
