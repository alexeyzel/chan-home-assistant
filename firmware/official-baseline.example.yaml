# Owner-tested baseline. main is mutable; preserve the working binary.
# Pin both the BSP and driver commits before publishing a release.
substitutions:
  name: stackchan-test
  friendly_name: StackChan Test

packages:
  stackchan:
    url: https://github.com/m5stack/esphome-yaml
    files:
      - examples/kit/stackchan-bsp.factory.yaml
    ref: main
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
