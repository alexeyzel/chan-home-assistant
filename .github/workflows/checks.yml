name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt ruff==0.16.10
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: python -m pytest -q
      - run: python -m pip install google-genai==2.21.0
      - name: Check pinned Gemini Live compatibility patch
        run: |
          git clone https://github.com/matt123p/ha-gemini-live .upstream/ha-gemini-live
          git -C .upstream/ha-gemini-live checkout d4ad0e523eca92f1c395e82da14d6da0fafd71be
          git -C .upstream/ha-gemini-live apply ../../patches/ha-gemini-live-tool-results.patch
          python tools/check_live_compat.py .upstream/ha-gemini-live/custom_components/gemini_live/stt.py

  firmware:
    runs-on: ubuntu-latest
    env:
      CHAN_PACKAGE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/prepare_remote_firmware.py "$CHAN_PACKAGE_REF" .runtime/remote-firmware
      - run: python -m esphome config .runtime/remote-firmware/chan.yaml
      - run: python -m esphome compile .runtime/remote-firmware/chan.yaml
